function storeOpen(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(Error('IndexedDB indisponível'));let req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{let d=req.result;if(!d.objectStoreNames.contains('state'))d.createObjectStore('state')};req.onsuccess=()=>{db=req.result;resolve()};req.onerror=()=>reject(req.error)})}
function dbGet(){return new Promise((resolve,reject)=>{let r=db.transaction('state').objectStore('state').get('main');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbSet(){return new Promise((resolve,reject)=>{let t=db.transaction('state','readwrite');t.objectStore('state').put(state,'main');t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error||Error('Transação abortada'))})}
function lsSave(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));return true}catch(e){toast('Falha ao salvar: '+e.message);return false}}
function persistNow(){clearTimeout(saveTimer);saveTimer=null;if(!bootReady)return Promise.resolve();if(!db){lsSave();return Promise.resolve()}return dbSet().catch(e=>{toast('Erro ao salvar no banco: '+(e.message||e));lsSave()})}
function persist(){if(!bootReady)return;clearTimeout(saveTimer);saveTimer=setTimeout(persistNow,120)}

function normalizeState(s){

 o.products=(Array.isArray(s.products)?s.products:[]).filter(p=>p&&p.name).map(p=>({...p,id:p.id||uid(),name:String(p.name).toUpperCase(),code:String(p.code??''),barcode:String(p.barcode??''),unit:UNITS.includes(p.unit)?p.unit:'KG',capacity:num(p.capacity)>0?num(p.capacity):null,aliases:Array.isArray(p.aliases)?p.aliases.map(String).filter(Boolean):[]}));
 o.stock=s.stock&&typeof s.stock==='object'&&!Array.isArray(s.stock)?s.stock:{};
 o.orders=s.orders&&typeof s.orders==='object'&&!Array.isArray(s.orders)?s.orders:{};
 o.history=(Array.isArray(s.history)?s.history:[]).filter(h=>h&&Array.isArray(h.entries)).map(h=>({...h,id:h.id||uid()}));

 o.settings={dark:false,...(s.settings||{})};o.lastDate=s.lastDate||today();o.version=2;return o}

// ---------- Apelidos e busca ----------
const VOICE_SUFFIX=new Set(['KG','KGS','QUILO','QUILOS','CX','CAIXA','CAIXAS','UN','UND','UNIDADE','UNIDADES','BD','BALDE','FD','FARDO','SC','SACO','SACOS','GRANEL','NAC','NACIONAL','IMPORTADO','IMPORTADA']);
const VOICE_STOP=new Set(['DE','DA','DO','DAS','DOS','EM','COM','TIPO','EXTRA']);
function mainWords(name){let w=norm(name).split(' ').filter(Boolean);while(w.length>1&&(VOICE_SUFFIX.has(w[w.length-1])||/^\d+(KG|G|UN|CX)$/.test(w[w.length-1])))w.pop();return w.filter(x=>!VOICE_STOP.has(x))}
function voiceCandidates(p){let main=mainWords(p.name),out=[main.join(' ')];if(main.length>1){out.push(main.slice(1).join(' '));if(main.length>2)out.push(main.slice(0,2).join(' '))}return [...new Set(out.map(norm).filter(Boolean))]}
function voiceIndex(){let all=new Map();for(const p of state.products){for(const x of [...voiceCandidates(p),...(p.aliases||[])]){let n=norm(x);if(!n)continue;let list=all.get(n)||new Set();list.add(p.id);all.set(n,list)}}return all}
function autoAliases(p,index){return voiceCandidates(p).filter(a=>a!==norm(p.name)&&index.get(a)?.size===1).map(x=>x.toLowerCase())}
function fillAliasesForCatalog(only){let index=voiceIndex(),added=0;for(const p of state.products){if(only&&!only.has(p.id))continue;p.aliases=p.aliases||[];let curr=new Set(p.aliases.map(norm));for(const a of autoAliases(p,index)){if(!curr.has(norm(a))){p.aliases.push(a);curr.add(norm(a));added++}}}return added}
function resolveVoiceProduct(raw){let n=norm(raw);if(!n)return {product:null,alternatives:[]};let exact=state.products.filter(p=>norm(p.code)===n||norm(p.barcode)===n||norm(p.name)===n);if(exact.length===1)return {product:exact[0],alternatives:[]};let m=state.products.filter(p=>voiceCandidates(p).includes(n)||(p.aliases||[]).some(a=>norm(a)===n));return m.length===1?{product:m[0],alternatives:[]}:{product:null,alternatives:m.length?m:exact}}
const keyCache=new WeakMap();
function searchKey(p){let sig=p.name+'|'+p.code+'|'+p.barcode+'|'+(p.aliases||[]).join(',');let c=keyCache.get(p);if(!c||c.sig!==sig){c={sig,key:' '+norm(sig.replace(/\|/g,' '))};keyCache.set(p,c)}return c.key}
function searchable(p,q){let n=norm(q);if(!n)return true;let k=searchKey(p);return n.split(' ').every(w=>k.includes(w))}
function matchProduct(raw,code=''){let n=norm(raw);if(code){let p=state.products.find(p=>p.code===code||p.barcode===code);if(p)return p}let key=state.matches[n];if(key&&product(key))return product(key);return resolveVoiceProduct(raw).product||matchByContainment(raw)}
// Descrição de NF-e (ex.: "BANANA PRATA CX 20KG") contém o nome/apelido do produto como palavras inteiras.
function matchByContainment(raw){let n=' '+norm(raw)+' ',best=null,len=0,tie=false;for(const p of state.products){let cands=[norm(p.name),...voiceCandidates(p),...(p.aliases||[]).map(norm)].filter(c=>c.length>=4);for(const c of cands){if(n.includes(' '+c+' ')){if(c.length>len){best=p;len=c.length;tie=false}else if(c.length===len&&best&&best.id!==p.id)tie=true}}}return tie?null:best}
function matchSuggestions(s){let words=norm(s).split(' ').filter(x=>x.length>2);return state.products.map(p=>({p,score:words.filter(w=>searchKey(p).includes(w)).length})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,4).map(x=>x.p)}

// ---------- Conversões ----------
function capacity(p){return num(p.capacity)}
// Converte uma quantidade na unidade informada para KG/UN do cadastro. Nunca assume capacidade inexistente.
function conv(p,q,u){q=num(q);if(!q)return null;if(u==='KG'||u==='UN')return {v:q,u};let c=capacity(p);if(c>0&&(p.unit==='KG'||p.unit==='UN'))return {v:q*c,u:p.unit};if(u===p.unit)return {v:q,u};return null}
function weight(p,q,u){let c=conv(p,q,u);return c&&c.u==='KG'?c.v:null}
function orderQty(id){return num(state.orders[id]?.qty)}
function defaultOrderUnit(p){return p.unit==='KG'?'CX':p.unit}

// ---------- Utilidades de interface ----------
function toast(msg,undo){let e=$('#toast');e.textContent='';let s=document.createElement('span');s.textContent=msg;e.append(s);if(undo){let b=document.createElement('button');b.type='button';b.className='toastbtn';b.textContent='Desfazer';b.onclick=()=>{e.classList.add('hide');undo()};e.append(b)}e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hide'),undo?5500:2800)}
function setPage(p){if(voiceActive&&!['stock','order'].includes(p))stopVoiceSession(false);page=p;query='';filter='all';listLimit=200;closeModal();render()}
function headerTitle(){return {stock:'Contagem de Estoque',order:'Realizar Pedido',history:'Contagens · 00h',products:'Produtos',settings:'Configurações',invoice:'Conferência de NF-e'}[page]||'FLV Mobile'}
function render(){ensureDay();let y=lastPage===page?window.scrollY:0;lastPage=page;document.body.classList.toggle('dark',!!state.settings.dark);
 $('#app').innerHTML=`<header class="top"><button class="iconbtn" onclick="openDrawer()" aria-label="Menu">${ico('menu')}</button><div class="heading"><div class="eyebrow">FLV · OPERAÇÃO</div><h1>${headerTitle()}</h1></div>${voiceActive?`<button class="live" onclick="toggleVoice()" aria-label="Parar escuta"><i></i>Ouvindo</button>`:''}${['stock','order'].includes(page)?`<button class="outline btnlabel" onclick="openInvoice()">${ico('fileText','sm')}<span>NF-e</span></button>`:''}</header><main class="main">${({stock:renderStock,order:renderOrder,history:renderHistory,products:renderProducts,settings:renderSettings,invoice:renderInvoice})[page]()}</main>${tabbar()}`;
 if(y)window.scrollTo(0,y)}
function tabbar(){return `<nav class="tabbar" aria-label="Navegação">${[['stock','package','Estoque'],['order','cart','Pedido'],['history','history','Contagens'],['products','book','Produtos']].map(([id,i,n])=>`<button class="tab ${page===id?'active':''}" onclick="setPage('${id}')">${ico(i)}<span>${n}</span></button>`).join('')}<button class="tab" onclick="openDrawer()">${ico('menu')}<span>Menu</span></button></nav>`}
function searchBox(ph){return `<div class="search">${ico('search','sm')}<input id="searchInput" type="search" enterkeyhint="search" value="${esc(query)}" placeholder="${ph}" oninput="searchChange(this.value)" onkeydown="if(event.key==='Enter')searchEnter()" autocomplete="off">${page==='stock'||page==='order'?`<button class="mini" onclick="openScanner()" aria-label="Ler código de barras">${ico('scan','sm')}</button><button class="primary mini" onclick="toggleVoice()" aria-label="Comando de voz">${voiceActive?ico('stop','sm'):ico('mic','sm')}</button>`:''}</div>`}
function searchChange(s){query=s;listLimit=200;refreshResults()}
function refreshResults(){let t=$('#results');if(!t)return render();t.innerHTML=page==='stock'?stockRows():page==='order'?orderRows():productRows()}
function moreBtn(total){return total>listLimit?`<div style="padding:12px"><button class="outline full" onclick="listLimit+=200;refreshResults()">Mostrar mais (${total-listLimit} restantes)</button></div>`:''}
function searchEnter(){let ps=state.products.filter(p=>searchable(p,query));if(ps.length===1)selectSearchProduct(ps[0].id)}
function selectSearchProduct(id){let p=product(id);if(!p)return;if(page==='stock'){openCount(id)}else if(page==='order'){let el=document.querySelector(`[data-order-id="${id}"] input.qty`);if(el){el.focus();el.select()}}}
function setFilter(f){filter=f;listLimit=200;render()}

// ---------- Contagem de estoque ----------
function stats(){let items=0,kg=0,un=0,emb=0;for(const [id,q] of Object.entries(state.stock)){let v=num(q),p=product(id);if(!v||!p)continue;items++;if(p.unit==='KG')kg+=v;else if(p.unit==='UN')un+=v;else emb+=v}return {items,kg,un,emb}}
function renderStock(){let s=stats();return `<div class="stats"><div class="stat"><div class="eyebrow">ITENS CONTADOS</div><strong>${s.items}</strong></div><div class="stat"><div class="eyebrow">TOTAL KG</div><strong>${fmt(s.kg)}</strong></div><div class="stat"><div class="eyebrow">TOTAL UN</div><strong>${fmt(s.un)}</strong>${s.emb?`<small>+ ${fmt(s.emb)} em embalagens</small>`:''}</div></div>${searchBox('Buscar produto, código ou apelido...')}<div class="hint inline-icon">${ico('spark','sm')}<span>Toque no microfone e diga “banana prata cinco caixas” para lançar sem tocar na tela.</span></div><div class="floatbar"><div class="chips"><button class="chip ${filter==='counted'?'active':''}" onclick="setFilter('counted')">Contados</button><button class="chip ${filter==='all'?'active':''}" onclick="setFilter('all')">Todos</button></div><button class="outline btnlabel" onclick="openMirror('stock')">${ico('clipboard','sm')}<span>Espelho</span></button></div><div id="results" class="productlist" style="margin-top:10px">${stockRows()}</div>`}
function stockRows(){if(!bootReady)return '';let ps=state.products.filter(p=>searchable(p,query)&&(filter==='all'||num(state.stock[p.id])>0)).sort(byName);
 if(!ps.length)return `<div class="empty"><strong>Nenhum produto encontrado</strong>${state.products.length?'Tente outro termo.':'Importe um arquivo TXT na aba Produtos.'}</div>`;
 return ps.slice(0,listLimit).map(p=>`<div class="productrow clickrow" onclick="openCount('${p.id}')"><div class="tile">${ico('box')}</div><div class="info"><div class="name">${esc(p.name)}</div><div class="sub">${esc(p.code||'Sem código')} · ${esc(p.unit)}${p.capacity?' · '+fmt(p.capacity)+' por emb.':''}</div></div><div class="amount">${fmt(state.stock[p.id])}<span class="unit">${esc(p.unit)}</span></div><span class="muted">${ico('chevRight','sm')}</span></div>`).join('')+moreBtn(ps.length)}
function openCount(id){let p=product(id);if(!p)return;selected=id;let packs=(p.unit==='KG'||p.unit==='UN')&&capacity(p)>0;
 showModal('Contagem de estoque',`<form onsubmit="saveCount(event)"><div class="notice"><strong>${esc(p.name)}</strong><div class="tiny muted">${esc(p.code||'Sem código')} · ${p.unit}${packs?' · '+fmt(p.capacity)+' '+p.unit+' por embalagem':''}</div></div><div class="${packs?'formgrid':''}" style="margin-top:12px"><div class="field"><label>Quantidade</label><input id="countInput" type="number" inputmode="decimal" min="0" step="any" value="${num(state.stock[id])}" onfocus="this.select()" oninput="countPreview()"></div>${packs?`<div class="field"><label>Informar em</label><select id="countUnit" onchange="countUnitChange()"><option>${p.unit}</option>${PACKS.map(u=>`<option>${u}</option>`).join('')}</select></div>`:''}</div><div id="countPrev" class="tiny muted" style="min-height:16px;margin:-4px 0 8px"></div><div class="quick" style="margin-bottom:12px"><button type="button" onclick="bumpCount(1)">+1</button><button type="button" onclick="bumpCount(5)">+5</button><button type="button" onclick="bumpCount(10)">+10</button></div><button class="primary full" type="submit">Salvar contagem</button><button type="button" class="outline full" style="margin-top:8px" onclick="$('#countInput').value=0;saveCount()">Zerar item</button></form>`);setTimeout(()=>$('#countInput')?.focus(),30)}
function countValue(){let p=product(selected),q=num($('#countInput').value),u=$('#countUnit')?.value;return p&&u&&u!==p.unit?q*capacity(p):q}
function countPreview(){let p=product(selected),u=$('#countUnit')?.value,e=$('#countPrev');if(e)e.textContent=p&&u&&u!==p.unit?`= ${fmt(countValue())} ${p.unit}`:''}
function countUnitChange(){let p=product(selected),u=$('#countUnit').value,cur=num(state.stock[selected]);$('#countInput').value=u===p.unit?cur:Math.round(cur/capacity(p)*1000)/1000;countPreview()}
function bumpCount(n){let i=$('#countInput');i.value=Math.round((num(i.value)+n)*1000)/1000;countPreview()}
function saveCount(e){if(e)e.preventDefault();let p=product(selected);if(!p)return;let q=Math.round(countValue()*1000)/1000;if(q)state.stock[p.id]=q;else delete state.stock[p.id];persist();closeModal();render();toast(`${p.name}: ${fmt(q)} ${p.unit}`)}

// ---------- Pedidos ----------
function orderTotals(){let kg=0,un=0,emb=0,unknown=0,count=0;for(const [id,o] of Object.entries(state.orders)){if(!num(o.qty))continue;let p=product(id);if(!p)continue;count++;let c=conv(p,o.qty,o.unit);if(!c)unknown++;else if(c.u==='KG')kg+=c.v;else if(c.u==='UN')un+=c.v;else emb+=c.v}return {kg,un,emb,unknown,count}}
function renderOrder(){let t=orderTotals();return `<div class="panel"><div class="eyebrow">PEDIDO EM MONTAGEM</div><div class="row between" style="margin-top:9px"><div><strong style="font-size:24px">${t.count}</strong> <span class="tiny muted">itens</span></div><div style="text-align:right"><div class="tiny muted">TOTAL CONVERTIDO</div><strong class="green">${fmt(t.kg)} kg · ${fmt(t.un)} un${t.emb?' · '+fmt(t.emb)+' emb.':''}</strong>${t.unknown?`<div class="tiny status-warn">${t.unknown} sem conversão</div>`:''}</div></div></div>${searchBox('Buscar item para pedir...')}<div class="floatbar" style="margin-bottom:10px"><div class="chips"><button class="chip ${filter==='ordered'?'active':''}" onclick="setFilter('ordered')">No pedido</button><button class="chip ${filter==='all'?'active':''}" onclick="setFilter('all')">Todos</button></div><button class="outline btnlabel" onclick="openMirror('order')">${ico('clipboard','sm')}<span>Espelho</span></button></div><div id="results" class="productlist">${orderRows()}</div><div class="actions"><button class="outline btnlabel" onclick="exportOrdersCSV()">${ico('download','sm')}<span>Exportar CSV</span></button><button class="outline btnlabel" onclick="clearOrders()">${ico('trash','sm')}<span>Limpar pedido</span></button></div>`}
function orderRows(){if(!bootReady)return '';let ps=state.products.filter(p=>searchable(p,query)&&(filter!=='ordered'||orderQty(p.id)>0)).sort(byName);if(!ps.length)return '<div class="empty">Nenhum produto encontrado.</div>';
 return ps.slice(0,listLimit).map(p=>{let o=state.orders[p.id]||{qty:0,unit:defaultOrderUnit(p)},q=num(o.qty),c=conv(p,q,o.unit);
  return `<div class="ordercard ${q?'on':''}" data-order-id="${p.id}"><div class="row between"><div class="grow"><div class="name">${esc(p.name)}</div><div class="tiny muted">${esc(p.code||'Sem código')} · estoque ${fmt(state.stock[p.id])} ${p.unit}</div></div><select class="unitselect" aria-label="Unidade" onchange="setOrderUnit('${p.id}',this.value)">${UNITS.map(u=>`<option ${u===o.unit?'selected':''}>${u}</option>`).join('')}</select><input class="qty" aria-label="Quantidade" type="number" inputmode="decimal" min="0" step="any" value="${q}" onfocus="this.select()" onchange="setOrderQty('${p.id}',this.value)"></div><div class="quick"><button onclick="addOrder('${p.id}',3)">+3</button><button onclick="addOrder('${p.id}',5)">+5</button><button onclick="addOrder('${p.id}',10)">+10</button></div><div class="orderfoot">${q?(c?(c.u===o.unit?'':`= ${fmt(c.v)} ${c.u}`):'Peso total desconhecido · sem conversão cadastrada'):''}</div></div>`}).join('')+moreBtn(ps.length)}
function setOrderUnit(id,u){let p=product(id);if(!p)return;state.orders[id]={qty:orderQty(id),unit:u};persist();render()}
function setOrderQty(id,q){let p=product(id);if(!p)return;let v=Math.round(num(q)*1000)/1000,u=state.orders[id]?.unit||defaultOrderUnit(p);if(v)state.orders[id]={qty:v,unit:u};else delete state.orders[id];persist();render()}
function addOrder(id,n){setOrderQty(id,orderQty(id)+n)}
function clearOrders(){if(confirm('Apagar todos os itens do pedido atual?')){state.orders={};persist();render();toast('Pedido limpo')}}

// ---------- Histórico ----------
function renderHistory(){return `<div class="panel"><div class="eyebrow">FECHAMENTO AUTOMÁTICO ÀS 00H</div><p class="small muted">Na mudança do dia, o aplicativo arquiva o estoque anterior assim que for aberto novamente. Você também pode guardar um ponto de controle agora.</p><button class="primary full btnlabel" onclick="saveHistory()">${ico('check','sm')}<span>Salvar agora (${stats().items} itens)</span></button></div><div class="sectionlabel">FECHAMENTOS ARQUIVADOS</div>${state.history.length?state.history.map(h=>`<div class="panel" style="margin-bottom:9px"><div class="row between"><div><strong>${esc(h.label)}</strong><div class="tiny muted">${datefmt(h.at)} · ${h.entries.length} itens</div></div><button class="outline btnlabel" onclick="openHistory('${h.id}')">${ico('clipboard','sm')}<span>Visualizar</span></button></div></div>`).join(''):'<div class="empty"><strong>Nenhum fechamento ainda</strong>O primeiro arquivamento acontece ao salvar ou na próxima virada do dia.</div>'}`}
function saveHistory(){if(archive('Fechamento manual')){render();toast('Contagem arquivada')}else toast('Nenhum item contado para arquivar')}
function openHistory(id){let h=state.history.find(x=>x.id===id);if(!h)return;showModal('Fechamento arquivado',`<div class="notice">${esc(h.label)}<br>${datefmt(h.at)} · ${h.entries.length} itens</div><div class="preview" style="margin:12px 0">${sheetHTML('stock',h)}</div><div class="actions noprint"><button class="primary btnlabel" onclick="shareMirror('stock','${id}')">${ico('share','sm')}<span>Enviar imagem</span></button><button class="outline btnlabel" onclick="saveMirrorImage('stock','${id}')">${ico('download','sm')}<span>Baixar PNG</span></button><button class="outline btnlabel" onclick="printMirror('stock','${id}')">${ico('print','sm')}<span>PDF / Imprimir</span></button><button class="outline btnlabel" onclick="exportHistoryCSV('${id}')">${ico('download','sm')}<span>CSV</span></button></div><button class="dangerbtn full" onclick="deleteHistory('${id}')">Excluir histórico</button>`,'wide')}
function deleteHistory(id){if(!confirm('Excluir este fechamento?'))return;state.history=state.history.filter(h=>h.id!==id);persist();closeModal();render()}
function exportHistoryCSV(id){let h=state.history.find(x=>x.id===id);if(!h)return;download('flv-fechamento-'+h.at.slice(0,10)+'.csv',csv([['Código','Mercadoria','Quantidade','Unidade'],...h.entries.map(e=>[e.product.code||'',e.product.name||'(removido)',e.qty,e.product.unit||''])]),'text/csv')}

// ---------- Produtos ----------
function renderProducts(){return `${searchBox('Buscar no dicionário...')}<div class="row between tiny muted" style="margin-top:-4px;margin-bottom:9px"><span></span><span>${state.products.length} produtos</span></div><div class="actions"><button class="primary btnlabel" onclick="openProduct()">${ico('plus','sm')}<span>Cadastrar</span></button><button class="outline btnlabel" onclick="$('#txtFile').click()">${ico('upload','sm')}<span>Importar TXT</span></button></div><input class="hide" id="txtFile" type="file" accept=".txt,text/plain,.csv" onchange="readTXT(this.files[0]);this.value=''"><div id="results" class="productlist">${productRows()}</div><div class="actions"><button class="outline btnlabel" onclick="exportProductsTXT()">${ico('download','sm')}<span>Exportar TXT</span></button><button class="outline btnlabel" onclick="exportProductsCSV()">${ico('download','sm')}<span>Exportar CSV</span></button></div><div class="actions"><button class="outline full btnlabel" style="grid-column:1/-1" onclick="generateAliasesNow()">${ico('spark','sm')}<span>Gerar apelidos para produtos já cadastrados</span></button></div>`}
function productRows(){if(!bootReady)return '';let ps=state.products.filter(p=>searchable(p,query)).sort(byName);if(!ps.length)return '<div class="empty"><strong>Seu dicionário está vazio</strong>Importe um TXT com código, mercadoria e capacidade opcional (ex.: 48 abacate 20kg).</div>';
 return ps.slice(0,listLimit).map(p=>`<div class="productrow"><button class="tile" style="cursor:pointer" onclick="openProduct('${p.id}')" aria-label="Editar">${ico('pencil','sm')}</button><div class="info clickrow" onclick="openProduct('${p.id}')"><div class="name">${esc(p.name)}</div><div class="sub">${esc(p.code||'Sem código')} · ${esc(p.unit)} · ${p.capacity?fmt(p.capacity):'sem capacidade'}</div></div><button class="mini danger" aria-label="Excluir" onclick="deleteProduct('${p.id}')">${ico('trash','sm')}</button></div>`).join('')+moreBtn(ps.length)}
function openProduct(id='',prefill={}){let p={id:'',name:'',code:'',barcode:'',unit:'KG',capacity:'',aliases:[],...(product(id)||{}),...prefill};selected=id;
 showModal(id?'Editar produto':'Cadastrar produto',`<form onsubmit="saveProduct(event)"><div class="field"><label>Código do item · opcional</label><div class="row"><input id="pcode" value="${esc(p.code)}" placeholder="Código de acesso" style="flex:1;min-width:0"><button type="button" class="primary" onclick="openScanner('pcode')" aria-label="Ler código">${ico('scan','sm')}</button></div></div><div class="field"><label>Nome oficial *</label><input id="pname" required value="${esc(p.name)}" placeholder="Ex.: BANANA PRATA"></div><div class="formgrid"><div class="field"><label>Unidade</label><select id="punit">${UNITS.map(u=>`<option ${u===p.unit?'selected':''}>${u}</option>`).join('')}</select></div><div class="field"><label>Capacidade por embalagem</label><input id="pcap" type="number" inputmode="decimal" min="0" step="any" value="${p.capacity||''}" placeholder="Ex.: 20"></div></div><div class="notice tiny" style="margin-bottom:11px">Capacidade: peso (se a unidade for KG) ou quantidade (se for UN) equivalente a uma caixa, saco, fardo ou embalagem. Deixe vazio quando não houver conversão conhecida.</div><div class="field"><label>Apelidos para voz (separe por vírgula)</label><input id="palias" value="${esc((p.aliases||[]).join(', '))}" placeholder="banana prata, prata"></div><div class="field"><label>Código de barras · opcional</label><input id="pbarcode" value="${esc(p.barcode||'')}"></div><button class="primary full" type="submit">Salvar produto</button></form>`)}
function saveProduct(e){e.preventDefault();let name=$('#pname').value.trim(),code=$('#pcode').value.trim(),barcode=$('#pbarcode').value.trim(),unit=$('#punit').value,cap=$('#pcap').value,aliases=[...new Set($('#palias').value.split(',').map(x=>x.trim()).filter(Boolean))];if(!name)return toast('Informe o nome do produto');let dupe=state.products.find(p=>p.id!==selected&&code&&p.code===code);if(dupe)return toast('Código já utilizado por '+dupe.name);
 let p={id:selected||uid(),name:name.toUpperCase(),code,barcode,unit,capacity:num(cap)>0?num(cap):null,aliases};if(selected)state.products=state.products.map(x=>x.id===selected?{...x,...p}:x);else{state.products.push(p);fillAliasesForCatalog(new Set([p.id]))}persist();let wasInvoice=activeInvoice;closeModal();if(wasInvoice!==null){invoiceMatch[wasInvoice]=p.id;page='invoice'}render();toast('Produto salvo: '+p.name)}
function deleteProduct(id){let p=product(id);if(!p||!confirm(`Excluir ${p.name}? O item sai do pedido e da contagem atual; fechamentos já arquivados são preservados.`))return;state.products=state.products.filter(x=>x.id!==id);delete state.stock[id];delete state.orders[id];for(const k of Object.keys(state.matches))if(state.matches[k]===id)delete state.matches[k];persist();render();toast('Produto excluído')}
function generateAliasesNow(){let n=fillAliasesForCatalog();persist();render();toast(n+' apelidos gerados para o catálogo')}

// ---------- Importação TXT: CÓDIGO NOME [CAPACIDADE] ----------
function parseTXT(text){
 let rows=[],bad=[];
 text.replace(/^﻿/,'').split(/\r?\n/).forEach((line,i)=>{
  let raw=line.trim();if(!raw)return;
  if(/^c[oó]d(?:igo)?\s*[/;,\t ]+\s*(?:nome|mercadoria)/i.test(raw))return;
  let m=raw.match(/^([a-z0-9][a-z0-9_.-]*)\s*(?:[;\t|/]\s*|\s+)(.+)$/i);
  if(!m){bad.push({line:i+1,text:raw,reason:'Código e nome não identificados'});return}
  let code=m[1],rest=m[2].trim().replace(/^['"]|['"]$/g,''),unit='KG',capacity=null,capacityProvided=false;
  let cap=rest.match(/(?:^|[\s;,|/])(?:CX\s*[:=-]?\s*)?(\d+(?:[.,]\d+)?)\s*(KG|KGS|QUILOS?|UN|UND|UNIDADES?)\s*$/i);
  if(cap){let val=Number(cap[1].replace(',','.'));if(val>0&&Number.isFinite(val)){capacity=val;unit=/^(UN|UND|UNIDADES?)$/i.test(cap[2])?'UN':'KG';capacityProvided=true;rest=rest.slice(0,cap.index).replace(/[\s;,|/]+$/,'').trim()}}
  let name=rest.replace(/^['"]|['"]$/g,'').trim();
  if(!name){bad.push({line:i+1,text:raw,reason:'Nome vazio'});return}
  rows.push({code,name:name.toUpperCase(),unit,capacity,capacityProvided,line:i+1});
 });return {rows,bad}}
async function readTXT(file){if(!file)return;let parsed;try{parsed=parseTXT(await file.text())}catch(e){return toast('Não foi possível ler o arquivo: '+e.message)}importRows=parsed.rows;importBad=parsed.bad;let codes=new Set(state.products.map(p=>p.code)),dup=parsed.rows.filter(r=>codes.has(r.code)).length;
 showModal('Prévia da importação TXT',`<div class="notice">${parsed.rows.length} registros válidos · ${dup} códigos já existentes · ${parsed.bad.length} linhas inválidas</div><div class="scrolltable" style="margin:12px 0"><table><thead><tr><th>Código</th><th>Mercadoria</th><th>Capacidade</th><th>Situação</th></tr></thead><tbody>${parsed.rows.slice(0,300).map(r=>`<tr><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td>${r.capacityProvided?fmt(r.capacity)+' '+esc(r.unit):'Não informada'}</td><td>${codes.has(r.code)?'Existente':'Novo'}</td></tr>`).join('')}</tbody></table></div>${parsed.rows.length>300?'<p class="tiny muted">Prévia dos primeiros 300 registros.</p>':''}<div class="field"><label>Quando o código já existir</label><select id="dupPolicy"><option value="keep">Manter cadastro existente</option><option value="update">Atualizar nome e capacidade informada</option></select></div><button class="primary full" onclick="commitImport()" ${parsed.rows.length?'':'disabled'}>Confirmar importação</button>${parsed.bad.length?`<p class="tiny status-warn">Linhas inválidas: ${parsed.bad.slice(0,15).map(x=>x.line).join(', ')}${parsed.bad.length>15?'…':''}</p>`:''}`,'wide')}
function commitImport(){let policy=$('#dupPolicy').value,added=0,updated=0,skipped=0,seen=new Set(),touched=new Set(),byCode=new Map(state.products.filter(p=>p.code).map(p=>[p.code,p]));
 for(const r of importRows){if(seen.has(r.code)){skipped++;continue}seen.add(r.code);let ex=byCode.get(r.code);if(ex){if(policy==='update'){touched.add(ex.id);ex.name=r.name;if(r.capacityProvided){ex.capacity=r.capacity;ex.unit=r.unit}updated++}else skipped++}else{let np={id:uid(),name:r.name,code:r.code,barcode:'',unit:r.unit,capacity:r.capacity,aliases:[]};state.products.push(np);touched.add(np.id);added++}}
 let aliases=fillAliasesForCatalog(touched);persist();render();
 showModal('Relatório de importação',`<div class="notice"><b>${added}</b> produtos novos · <b>${updated}</b> atualizados · <b>${skipped}</b> ignorados (duplicados) · <b>${aliases}</b> apelidos criados · <b>${importBad.length}</b> linhas inválidas</div>${importBad.length?`<div class="scrolltable" style="margin:12px 0"><table><thead><tr><th>Linha</th><th>Conteúdo</th><th>Motivo</th></tr></thead><tbody>${importBad.slice(0,50).map(b=>`<tr><td>${b.line}</td><td>${esc(b.text)}</td><td>${esc(b.reason)}</td></tr>`).join('')}</tbody></table></div>`:''}<button class="primary full" style="margin-top:12px" onclick="closeModal()">Concluir</button>`);importRows=[];importBad=[]}

function download(name,data,type='text/plain;charset=utf-8'){let b=new Blob([data],{type}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function csv(rows){return '﻿'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n')}
function exportProductsTXT(){download('flv-produtos.txt',state.products.map(p=>`${p.code||''} ${p.name}${num(p.capacity)>0?' '+String(p.capacity).replace('.',',')+(p.unit==='UN'?'un':'kg'):''}`.trim()).join('\n'))}
function exportProductsCSV(){download('flv-produtos.csv',csv([['Código','Mercadoria','Unidade','Capacidade','Apelidos'],...state.products.map(p=>[p.code,p.name,p.unit,p.capacity,(p.aliases||[]).join(', ')])]),'text/csv')}
function exportOrdersCSV(){download('flv-pedido.csv',csv([['Código','Mercadoria','Quantidade','Unidade','KG convertido','UN convertido'],...Object.entries(state.orders).filter(([id,o])=>num(o.qty)&&product(id)).map(([id,o])=>{let p=product(id),c=conv(p,o.qty,o.unit);return [p.code,p.name,o.qty,o.unit,c&&c.u==='KG'?c.v:'',c&&c.u==='UN'?c.v:'']})]),'text/csv')}
function backup(){state.settings.lastBackup=new Date().toISOString();persist();download('backup-flv-'+today()+'.json',JSON.stringify({app:'FLV Mobile Offline',exportedAt:new Date().toISOString(),state},null,2),'application/json');setTimeout(render,50)}
async function restore(file){if(!file)return;try{let x=JSON.parse(await file.text()),s=x.state||x;if(!Array.isArray(s.products)||typeof s.stock!=='object'||typeof s.orders!=='object'||!Array.isArray(s.history))throw Error('estrutura incompatível');let n=normalizeState(s);if(!confirm(`Restaurar ${n.products.length} produtos e ${n.history.length} fechamentos? Isso substitui os dados atuais. Faça um backup antes se necessário.`))return;state=n;await persistNow();render();toast('Backup restaurado')}catch(e){toast('Arquivo inválido: '+e.message)}}
function resetAll(){if(prompt('Para apagar todos os dados, digite APAGAR:')!=='APAGAR')return;state=defaultState();persistNow();render();toast('Dados apagados')}
function renderSettings(){let b=state.settings.lastBackup;return `<div class="panel"><div class="sectionlabel" style="margin-top:0">ARMAZENAMENTO</div><p class="small muted">Os dados ficam neste navegador, neste aparelho. Faça backups frequentes: limpar os dados do navegador pode apagar o catálogo e os lançamentos.</p><div class="actions"><button class="primary btnlabel" onclick="backup()">${ico('download','sm')}<span>Backup JSON</span></button><button class="outline btnlabel" onclick="$('#restoreFile').click()">${ico('upload','sm')}<span>Restaurar</span></button></div><input id="restoreFile" type="file" class="hide" accept=".json,application/json" onchange="restore(this.files[0]);this.value=''"><div class="notice">${state.products.length} produtos · ${stats().items} itens contados · ${orderTotals().count} itens no pedido · ${state.history.length} fechamentos<br>Último backup: ${b?datefmt(b):'nunca'} · Banco: ${db?'IndexedDB':'alternativo (localStorage)'}</div>${installEvt?`<hr class="divider"><div class="row between"><span>Instalar na tela inicial</span><button class="primary" onclick="installApp()">Instalar</button></div>`:''}<hr class="divider"><div class="row between"><strong>Modo escuro</strong><button class="outline" onclick="state.settings.dark=!state.settings.dark;persist();render()">${state.settings.dark?'Ativado':'Desativado'}</button></div><hr class="divider"><button class="dangerbtn full" onclick="resetAll()">Apagar todos os dados deste aplicativo</button></div><div class="sectionlabel">SOBRE</div><div class="notice">FLV Operação · Versão 4.0. Aplicativo independente, sem serviços externos. Banco local IndexedDB. Voz e câmera dependem das permissões e do suporte do navegador; o reconhecimento de voz do Chrome pode exigir internet.</div>`}

 $('#portal').innerHTML=`<div class="drawerbg" onclick="closeModal()"><nav class="drawer" onclick="event.stopPropagation()"><div class="row between" style="margin-bottom:18px"><div class="row"><div class="tile" style="background:var(--btn);color:#fff">${ico('box')}</div><div><strong>FLV Mobile</strong><div class="eyebrow">HORTIFRÚTI</div></div></div><button class="iconbtn" onclick="closeModal()" aria-label="Fechar">${ico('close')}</button></div>${names.map(([id,i,n,d])=>`<button class="navitem ${page===id?'active':''}" onclick="setPage('${id}')"><span class="navico">${ico(i)}</span><span><b>${n}</b><small>${d}</small></span></button>`).join('')}<div style="flex:1"></div><button class="outline full btnlabel" style="margin-top:14px" onclick="state.settings.dark=!state.settings.dark;persist();render();openDrawer()">${state.settings.dark?ico('sun','sm'):ico('moon','sm')}<span>Modo ${state.settings.dark?'Claro':'Escuro'}</span></button><div class="tiny muted" style="text-align:center;margin-top:14px">Dados salvos no aparelho · v4.0</div></nav></div>`}

// ---------- Espelhos (estoque e pedido) ----------
function mirrorRows(kind,history=null){let r;if(history)r=history.entries.map(e=>({p:e.product,q:e.qty,u:e.product.unit}));else if(kind==='stock')r=Object.entries(state.stock).filter(([id,q])=>num(q)>0&&product(id)).map(([id,q])=>({p:product(id),q,u:product(id).unit}));else r=Object.entries(state.orders).filter(([id,o])=>num(o.qty)>0&&product(id)).map(([id,o])=>({p:product(id),q:o.qty,u:o.unit}));return r.filter(x=>x.p&&x.p.name).sort((a,b)=>COLL.compare(a.p.name,b.p.name))}
function sheetData(kind,history=null){return mirrorRows(kind,history).map(({p,q,u})=>{let estoque=history?num(q):num(state.stock[p.id]),pu=p.unit||'KG';let estTexto=estoque?`${fmt(estoque)} ${pu}`:'0';let cap=num(p.capacity);if(cap&&estoque>0){let cx=estoque/cap;if(Number.isInteger(cx))estTexto=`${fmt(cx)}cx (${estoque.toFixed(1)} ${pu.toLowerCase()})`}
 let c=kind==='order'?conv(p,q,u):null;return {code:p.code||'—',name:p.name,stockText:estTexto,quantity:kind==='order'?(c?c.v:num(q)):num(q),unit:kind==='order'?(c?c.u:u):pu}})}
function sheetHTML(kind,history=null){let rows=sheetData(kind,history),title=kind==='stock'?'CONTAGEM DE ESTOQUE':'PEDIDO DE COMPRA',isOrder=kind==='order';return `<div class="sheet"><div class="sheethead">${title} - HORTIFRÚTI<small>Emissão: ${new Date().toLocaleString('pt-BR')} | Total de Itens: ${rows.length}</small></div><table><thead><tr><th>CÓD.</th><th>QTD ESTQ</th><th>MERCADORIA</th>${isOrder?'<th class="r">PEDIDO</th>':''}<th>UN</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.code)}</td><td style="color:#657b92">${esc(r.stockText)}</td><td>${esc(r.name)}</td>${isOrder?`<td class="r" style="color:#00835e;font-weight:750">${fmt(r.quantity)}</td>`:''}<td>${esc(r.unit)}</td></tr>`).join('')}</tbody></table><div class="sheetfooter">Gerado automaticamente por Gestor Hortifrúti FLV</div></div>`}
function openMirror(kind){if(!mirrorRows(kind).length)return toast(kind==='stock'?'Nenhum item contado para o espelho':'Nenhum item no pedido para o espelho');
 showModal('Espelho · '+(kind==='stock'?'Contagem de estoque':'Realizar Pedido'),`<div class="preview">${sheetHTML(kind)}</div><p class="tiny muted" style="text-align:center">A imagem PNG é gerada em alta resolução no mesmo modelo.</p><div class="actions noprint"><button class="primary btnlabel" onclick="shareMirror('${kind}')">${ico('share','sm')}<span>Enviar imagem / WhatsApp</span></button><button class="outline btnlabel" onclick="saveMirrorImage('${kind}')">${ico('download','sm')}<span>Baixar PNG</span></button><button class="outline btnlabel" style="grid-column:1/-1" onclick="printMirror('${kind}')">${ico('print','sm')}<span>PDF / Imprimir</span></button></div>`,'wide')}
function getMirrorHistory(id){return id?state.history.find(h=>h.id===id)||null:null}
function printMirror(kind,hid=null){let html=`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espelho FLV</title><style>body{font-family:Arial,sans-serif;margin:0;color:#253044}.sheetfooter{padding:20px;color:#94a3b8;font-size:11px}.sheethead{background:#075e43;color:#fff;padding:25px 30px;font-size:22px;font-weight:bold}.sheethead small{display:block;margin-top:8px;font-size:13px;font-weight:normal;color:#c6e2d6}table{width:100%;border-collapse:collapse;font-size:13px}th{background:#f0f4f9;text-align:left;padding:12px 14px;color:#475569}td{padding:13px 14px;border-bottom:1px solid #e5edf3}tbody tr:nth-child(even){background:#f7f9fb}.r{text-align:right}@page{size:portrait;margin:8mm}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body>${sheetHTML(kind,getMirrorHistory(hid))}</body></html>`;
 let win=window.open('','_blank');if(win){win.document.open();win.document.write(html);win.document.close();setTimeout(()=>win.print(),200);return}
 let f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';f.srcdoc=html;f.onload=()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){toast('Não foi possível imprimir: use Baixar PNG')}setTimeout(()=>f.remove(),60000)};document.body.append(f)}
// Gera uma ou mais imagens (páginas) para evitar estourar o limite de altura do canvas em listas grandes.
function mirrorCanvases(kind,history=null){let rows=sheetData(kind,history),order=kind==='order',W=1440,pad=42,topH=192,colH=75,footH=93,MAXH=14000,widths=order?[117,280,780,135,128]:[117,330,865,128];
 let mc=document.createElement('canvas').getContext('2d');mc.font='26px Arial';
 function split(str,max){let words=String(str).split(/\s+/),lines=[],line='';for(let w of words){let t=line?line+' '+w:w;if(mc.measureText(t).width>max&&line){lines.push(line);line=w}else line=t}lines.push(line||'');return lines}
 let layouts=rows.map(r=>{let nl=split(r.name,widths[2]-35),sl=split(r.stockText,widths[1]-22);return {...r,nameLines:nl,stockLines:sl,height:Math.max(77,32*Math.max(nl.length,sl.length)+38)}});
 let pages=[],cur=[],h=topH+colH+footH;for(const r of layouts){if(cur.length&&h+r.height>MAXH){pages.push(cur);cur=[];h=topH+colH+footH}cur.push(r);h+=r.height}pages.push(cur);
 return pages.map((pg,pi)=>{let height=topH+colH+pg.reduce((s,r)=>s+r.height,0)+footH,cv=document.createElement('canvas');cv.width=W;cv.height=height;let ctx=cv.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,height);ctx.fillStyle='#075e43';ctx.fillRect(0,0,W,topH);ctx.fillStyle='#fff';ctx.font='bold 46px Arial';ctx.fillText((order?'PEDIDO DE COMPRA':'CONTAGEM DE ESTOQUE')+' - HORTIFRÚTI',pad,92);
  ctx.font='26px Arial';ctx.fillStyle='#c7e5d9';ctx.fillText('Emissão: '+new Date().toLocaleString('pt-BR')+' | Total de Itens: '+rows.length+(pages.length>1?` | Página ${pi+1}/${pages.length}`:''),pad,148);
  ctx.fillStyle='#f0f4f9';ctx.fillRect(0,topH,W,colH);let heads=order?['CÓD.','QTD ESTQ','MERCADORIA','PEDIDO','UN']:['CÓD.','QTD ESTQ','MERCADORIA','UN'];ctx.font='25px Arial';ctx.fillStyle='#475569';let x=0;heads.forEach((t,i)=>{ctx.fillText(t,x+pad,topH+49);x+=widths[i]});
  let y=topH+colH;pg.forEach((r,i)=>{ctx.fillStyle=i%2?'#f5f8fa':'#fff';ctx.fillRect(0,y,W,r.height);ctx.fillStyle='#e4eaf0';ctx.fillRect(0,y+r.height-1,W,1);let vals=order?[r.code,r.stockText,r.name,fmt(r.quantity),r.unit]:[r.code,r.stockText,r.name,r.unit],cx=0;
   vals.forEach((v,j)=>{ctx.fillStyle=order&&j===3?'#00835e':j===1?'#657b92':'#253044';ctx.font=(order&&j===3?'bold ':'')+'26px Arial';let lines=j===2?r.nameLines:j===1?r.stockLines:split(v,widths[j]-22);lines.forEach((ln,k)=>ctx.fillText(ln,cx+pad,y+Math.min(46,r.height-15)+k*32));cx+=widths[j]});y+=r.height});
  ctx.fillStyle='#94a3b8';ctx.font='21px Arial';ctx.fillText('Gerado automaticamente por Gestor Hortifrúti FLV',pad,y+55);return cv})}
function mirrorFiles(kind,hid=null){let cvs=mirrorCanvases(kind,getMirrorHistory(hid));return Promise.all(cvs.map((cv,i)=>new Promise((res,rej)=>cv.toBlob(b=>b?res(new File([b],`FLV_${kind==='stock'?'CONTAGEM':'PEDIDO'}_${today()}${cvs.length>1?'_p'+(i+1):''}.png`,{type:'image/png'})):rej(Error('Imagem não gerada')),'image/png'))))}
function saveFiles(files){files.forEach((f,i)=>setTimeout(()=>{let url=URL.createObjectURL(f),a=document.createElement('a');a.href=url;a.download=f.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)},i*400))}
async function saveMirrorImage(kind,hid=null){try{let files=await mirrorFiles(kind,hid);saveFiles(files);toast(files.length>1?files.length+' imagens PNG geradas':'Imagem PNG gerada')}catch(e){toast('Erro ao gerar imagem: '+e.message)}}
async function shareMirror(kind,hid=null){try{let files=await mirrorFiles(kind,hid);if(navigator.share&&navigator.canShare&&navigator.canShare({files})){await navigator.share({files,title:'Espelho FLV'});return}saveFiles(files);showModal('Imagem salva para o WhatsApp',`<div class="notice">Este navegador não permite compartilhar arquivos diretamente. A imagem PNG foi baixada. No WhatsApp, abra a conversa, toque em Anexar → Galeria/Documento e selecione o arquivo FLV.</div><button class="primary full" style="margin-top:12px" onclick="closeModal()">Entendi</button>`)}catch(e){if(e.name!=='AbortError')toast('Compartilhamento: '+e.message)}}

// ---------- Conferência de NF-e ----------
function openInvoice(){page='invoice';query='';closeModal();render()}
function invoiceWeight(r){return r.weight!=null?r.weight:(r.manual!=null?r.manual:(r.unit==='KG'?r.qty:null))}
function invoiceBase(p,r){if(p.unit==='KG')return invoiceWeight(r);let c=capacity(p);if(p.unit==='UN'){if(r.unit==='UN')return r.qty;if(PACKS.includes(r.unit)&&c>0)return r.qty*c;return null}return r.unit===p.unit?r.qty:null}
function invoiceSummary(){let g={};invoiceRows.forEach((r,i)=>{let id=invoiceMatch[i];if(!id||!product(id))return;let o=g[id]||(g[id]={p:product(id),recv:0,unknown:false,lines:0});o.lines++;let w=invoiceBase(o.p,r);if(w===null)o.unknown=true;else o.recv+=w});
 if(invoiceRows.length)for(const [id,o] of Object.entries(state.orders)){if(!g[id]&&num(o.qty)&&product(id))g[id]={p:product(id),recv:0,unknown:false,lines:0,pending:true}}
 for(const id in g){let p=g[id].p,o=state.orders[id];g[id].hasOrder=!!(o&&num(o.qty));let c=g[id].hasOrder?conv(p,num(o.qty),o.unit):null;g[id].expected=c&&c.u===p.unit?c.v:null}return g}
function groupStatus(g){if(g.pending)return 'Pendente';if(g.unknown)return 'Revisão necessária';if(!g.hasOrder)return 'Sem pedido';if(g.expected===null)return 'Revisão necessária';return Math.abs(g.recv-g.expected)<0.01?'Conferido':'Divergente'}
function pillClass(s){return s==='Conferido'?'status-good':s==='Divergente'?'status-bad':'status-warn'}
function renderInvoice(){let sum=invoiceSummary();return `<div class="panel"><div class="eyebrow">NOTA FISCAL</div><h2 style="margin:5px 0 10px;font-size:17px">Entrada de NF-e</h2><div class="actions"><button class="outline btnlabel" onclick="$('#xmlFile').click()">${ico('fileText','sm')}<span>Arquivo XML</span></button><button class="outline btnlabel" onclick="$('#mediaFile').click()">${ico('camera','sm')}<span>Imagem ou PDF</span></button></div><input id="xmlFile" type="file" class="hide" accept=".xml,text/xml,application/xml" onchange="readInvoiceXML(this.files[0]);this.value=''"><input id="mediaFile" type="file" class="hide" accept="image/*,.pdf,application/pdf" onchange="showInvoiceMedia(this.files[0]);this.value=''"><p class="small muted">O XML permite extrair os itens sem internet. Imagens e PDFs podem ser anexados apenas para conferência visual; OCR automático não está disponível nesta versão.</p></div>
${invoiceRows.length?`<div class="sectionlabel">RESUMO POR PRODUTO · RECEBIDO × PEDIDO</div><div class="productlist">${Object.values(sum).map(g=>{let s=groupStatus(g);return `<div class="ordercard"><div class="row between"><div class="grow"><strong class="small">${esc(g.p.name)}</strong><div class="tiny muted">${g.lines} linha(s) · recebido ${g.unknown?'incompleto':fmt(g.recv)+' '+esc(g.p.unit)} · pedido ${g.expected===null?(g.hasOrder?'sem conversão':'—'):fmt(g.expected)+' '+esc(g.p.unit)}</div></div><span class="pill ${pillClass(s)}">${s}</span></div>${!g.unknown&&g.expected!==null?`<div class="tiny" style="margin-top:5px">Diferença: <b>${fmt(g.recv-g.expected)} ${esc(g.p.unit)}</b></div>`:''}</div>`}).join('')||'<div class="empty">Vincule itens da nota aos produtos para conferir.</div>'}</div>
<div class="sectionlabel">ITENS DA NOTA · ${esc(invoiceFile)}</div><div class="productlist">${invoiceRows.map((r,i)=>{let p=product(invoiceMatch[i]||''),w=invoiceWeight(r),st=!p?'Pendente':w===null?'Revisão necessária':'Vinculado',sug=matchSuggestions(r.name).filter(x=>x.id!==p?.id);
 return `<div class="ordercard"><div class="row between"><div class="grow"><strong class="small">${esc(r.name)}</strong><div class="tiny muted">${fmt(r.qty)} ${esc(r.unit)} · ${w===null?'Peso não identificado':fmt(w)+' kg'}</div></div><span class="pill ${st==='Vinculado'?'status-good':'status-warn'}">${st}</span></div><div class="row" style="margin-top:8px"><select class="unitselect grow" style="max-width:none" onchange="linkInvoice(${i},this.value)"><option value="">Vincular ao produto...</option>${p?`<option value="${p.id}" selected>${esc(p.name)}</option>`:''}${sug.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}<option value="__pick">Buscar outro produto…</option></select><button class="mini" onclick="newFromInvoice(${i})" aria-label="Cadastrar novo produto">${ico('plus','sm')}</button></div>${r.weight==null&&r.unit!=='KG'?`<div class="row" style="margin-top:8px"><span class="tiny muted grow">Peso total (kg) conforme etiqueta:</span><input class="qty" type="number" inputmode="decimal" min="0" step="any" value="${r.manual??''}" onfocus="this.select()" onchange="setInvoiceWeight(${i},this.value)"></div>`:''}</div>`}).join('')}</div><div class="actions"><button class="outline btnlabel" onclick="exportInvoiceCSV()">${ico('download','sm')}<span>Relatório CSV</span></button><button class="primary btnlabel" onclick="saveInvoiceMatches()">${ico('check','sm')}<span>Salvar associações</span></button></div>`:''}`}
async function readInvoiceXML(file){if(!file)return;let raw=await file.text(),xml=new DOMParser().parseFromString(raw,'application/xml');if(xml.querySelector('parsererror'))return toast('XML inválido');let det=[...xml.getElementsByTagNameNS('*','det')];if(!det.length)return toast('Nenhum item de NF-e encontrado');
 invoiceFile=file.name;invoiceRows=det.map(d=>{let prod=d.getElementsByTagNameNS('*','prod')[0],get=t=>prod?.getElementsByTagNameNS('*',t)[0]?.textContent||'';let name=get('xProd'),qty=num(get('qCom')),unit=get('uCom').toUpperCase().trim(),code=get('cProd'),barcode=get('cEAN');if(/^(QUILOS?|KGS?)$/.test(unit))unit='KG';let wv=null;if(unit==='KG')wv=qty;else{let m=name.match(/(\d+(?:[.,]\d+)?)\s*KG\b/i);if(m&&qty)wv=qty*num(m[1])}return {name,qty,unit,code,barcode,weight:wv,manual:null}});
 invoiceMatch={};invoiceRows.forEach((r,i)=>{let p=matchProduct(r.name,/^\d{8,14}$/.test(r.barcode)?r.barcode:'');if(p)invoiceMatch[i]=p.id});render();toast(invoiceRows.length+' itens extraídos do XML')}
function setInvoiceWeight(i,v){invoiceRows[i].manual=num(v)>0?num(v):null;render()}
function showInvoiceMedia(file){if(!file)return;let url=URL.createObjectURL(file),pdf=file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf');showModal('Conferência visual',`<div class="notice">Arquivo para conferência visual: <b>${esc(file.name)}</b>. A extração automática de texto (OCR) não está implementada. Para conferência automática, importe o XML da NF-e.</div><div style="margin-top:12px">${pdf?`<iframe title="Nota fiscal" src="${url}" style="width:100%;height:55vh;border:1px solid var(--line)"></iframe>`:`<img src="${url}" style="max-width:100%;border-radius:12px" alt="Nota fiscal">`}</div>`,'wide')}
function linkInvoice(i,id){if(id==='__pick')return openPicker(i);if(id)invoiceMatch[i]=id;else delete invoiceMatch[i];render()}
function openPicker(i){showModal('Vincular item da nota',`<div class="notice small">${esc(invoiceRows[i].name)}</div><div class="search" style="margin:10px 0"><input id="pickQ" placeholder="Buscar produto..." oninput="pickFilter(${i},this.value)" autocomplete="off"></div><div id="pickList" class="productlist"></div>`);pickFilter(i,'');setTimeout(()=>$('#pickQ')?.focus(),30)}
function pickFilter(i,q){let ps=state.products.filter(p=>searchable(p,q)).sort(byName).slice(0,60);$('#pickList').innerHTML=ps.map(p=>`<div class="productrow clickrow" onclick="pickChoose(${i},'${p.id}')"><div class="info"><div class="name">${esc(p.name)}</div><div class="sub">${esc(p.code||'Sem código')} · ${esc(p.unit)}</div></div></div>`).join('')||'<div class="empty">Nenhum produto encontrado.</div>'}
function pickChoose(i,id){closeModal();linkInvoice(i,id)}
function newFromInvoice(i){let r=invoiceRows[i];openProduct('',{name:r.name,code:'',barcode:/^\d{8,14}$/.test(r.barcode)?r.barcode:'',unit:r.unit==='UN'?'UN':'KG'});activeInvoice=i}
function saveInvoiceMatches(){let n=0;invoiceRows.forEach((r,i)=>{if(invoiceMatch[i]){state.matches[norm(r.name)]=invoiceMatch[i];n++}});persist();toast(n+' associações salvas')}
function exportInvoiceCSV(){let sum=invoiceSummary();download('flv-conferencia-nfe.csv',csv([['Descrição NF-e','Quantidade','Unidade','Peso identificado (kg)','Produto vinculado','Unidade do produto','Pedido','Recebido','Situação'],...invoiceRows.map((r,i)=>{let p=product(invoiceMatch[i]),g=p&&sum[p.id],w=invoiceWeight(r);return [r.name,r.qty,r.unit,w??'',p?.name||'',p?.unit||'',g?.expected??'',g&&!g.unknown?g.recv:'',g?groupStatus(g):'Pendente']}),...Object.values(sum).filter(g=>g.pending).map(g=>['(não veio na nota)','','','',g.p.name,g.p.unit,g.expected??'',0,'Pendente'])]),'text/csv')}

// ---------- Voz: só registra comando completo (produto inequívoco + quantidade) ----------
let voiceRestart=null,voiceStarting=false,voiceFailures=0,lastVoiceKey='',lastVoiceAt=0;
const NU={um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9},NT={dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19},NX={vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90},NALL={...NU,...NT,...NX,cem:100};
const UW={quilo:'KG',quilos:'KG',kilo:'KG',kilos:'KG',kg:'KG',un:'UN',unidade:'UN',unidades:'UN',caixa:'CX',caixas:'CX',cx:'CX',saco:'SC',sacos:'SC',sc:'SC',fardo:'FD',fardos:'FD',fd:'FD',balde:'BD',baldes:'BD',bd:'BD'};
const HESITATE=new Set(['E','EH','AH','DE','DO','DA','DOS','DAS','PARA','COM','MAIS','MENOS','TIPO','ACHO','ESPERA','ENTAO','ASSIM','TALVEZ','OU','UNS','UMAS','QUASE','UNS','AI','HM']);
function parseVoice(s){
 let t=norm(s).toLowerCase().split(' ').filter(Boolean);if(t.length<2)return null;
 let unit=null;if(UW[t[t.length-1]]){unit=UW[t.pop()]}
 let L=t.length,a=t[L-1],qty=null,used=0;if(L<2)return null;
 if(/^\d+(?:[.,]\d+)?$/.test(a)){qty=num(a);used=1}
 else if(L>=4&&NX[t[L-3]]&&t[L-2]==='e'&&NU[a]){qty=NX[t[L-3]]+NU[a];used=3}
 else if(NALL[a]){qty=NALL[a];used=1}
 if(qty===null||!(qty>0)||qty>100000)return null;
 t.length=L-used;if(!t.length)return null;
 if(t.some(w=>HESITATE.has(w.toUpperCase())&&(w==='talvez'||w==='acho'||w==='espera'||w==='entao'||w==='assim'||w==='tipo'||w==='ou'))||HESITATE.has(t[t.length-1].toUpperCase()))return null;
 return {name:t.join(' '),qty,unit,raw:s}}
function startVoiceRecognition(){if(!voiceActive||!voice||voiceStarting||document.hidden)return;voiceStarting=true;try{voice.start()}catch(e){voiceStarting=false;if(e.name!=='InvalidStateError')scheduleVoiceRestart()}}
function scheduleVoiceRestart(){clearTimeout(voiceRestart);if(!voiceActive||document.hidden)return;voiceRestart=setTimeout(startVoiceRecognition,Math.min(600+voiceFailures*500,4000))}
function stopVoiceSession(redraw=true){voiceActive=false;clearTimeout(voiceRestart);voiceStarting=false;try{voice?.abort()}catch(e){}if(redraw)render()}
function toggleVoice(){
 if(voiceActive){stopVoiceSession();toast('Escuta encerrada');return}
 if(!window.isSecureContext){toast('Microfone: abra o aplicativo por HTTPS (ou localhost) e autorize a permissão do navegador.');return}
 let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Reconhecimento de voz indisponível neste navegador. Use o Chrome para Android.');return}
 voice=new SR();voice.lang='pt-BR';voice.continuous=true;voice.interimResults=false;voice.maxAlternatives=1;voiceFailures=0;
 voice.onstart=()=>{voiceStarting=false};
 voice.onresult=e=>{if(!voiceActive)return;for(let i=e.resultIndex;i<e.results.length;i++){if(!e.results[i].isFinal)continue;let phrase=e.results[i][0].transcript.trim();if(!phrase)continue;voiceFailures=0;let key=norm(phrase),now=Date.now();if(key===lastVoiceKey&&now-lastVoiceAt<2800)continue;lastVoiceKey=key;lastVoiceAt=now;if(modal)continue;handleVoice(phrase)}};
 voice.onerror=e=>{voiceStarting=false;
  if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){stopVoiceSession();showModal('Microfone bloqueado',`<div class="notice">Não foi possível usar o microfone (<b>${esc(e.error)}</b>). Abra o aplicativo por HTTPS, permita o microfone nas configurações do Chrome/Android e verifique se o serviço de voz está disponível (pode exigir internet).</div><button class="primary full" style="margin-top:12px" onclick="closeModal()">Entendi</button>`)}
  else if(e.error!=='no-speech'&&e.error!=='aborted'){voiceFailures++;if(voiceFailures>=4){stopVoiceSession();toast('Voz interrompida após falhas repetidas ('+e.error+'). Toque no microfone para tentar de novo.')}}};
 voice.onend=()=>{voiceStarting=false;if(voiceActive)scheduleVoiceRestart()};
 voiceActive=true;startVoiceRecognition();render();toast('Escuta contínua ativada · toque no microfone para parar')}
function handleVoice(s){if(!['stock','order'].includes(page))return;let cmd=parseVoice(s);if(!cmd)return;let f=resolveVoiceProduct(cmd.name);if(!f.product){if(f.alternatives.length>1)toast('Ambíguo: '+f.alternatives.slice(0,3).map(p=>p.name).join(' / ')+'. Diga o nome completo.');return}commitVoice(f.product,cmd)}
function commitVoice(p,cmd){
 if(page==='order'){let u=cmd.unit||defaultOrderUnit(p),cur=state.orders[p.id],prev=cur?{...cur}:null;
  if(cur&&num(cur.qty)>0&&cur.unit!==u){modal='voz';showModal('Unidade diferente',`<div class="notice"><b>${esc(p.name)}</b> já está no pedido com ${fmt(cur.qty)} ${esc(cur.unit)}. Substituir por ${fmt(cmd.qty)} ${u}?</div><div class="actions"><button class="primary" onclick="closeModal();state.orders['${p.id}']={qty:${cmd.qty},unit:'${u}'};persist();render();toast('Pedido atualizado')">Substituir</button><button class="outline" onclick="closeModal()">Cancelar</button></div>`);return}
  state.orders[p.id]={qty:orderQty(p.id)+cmd.qty,unit:u};persist();render();toast(`✓ ${p.name} · ${fmt(cmd.qty)} ${u}`,()=>{if(prev)state.orders[p.id]=prev;else delete state.orders[p.id];persist();render()});return}
 let q=null;if(!cmd.unit||cmd.unit===p.unit)q=cmd.qty;else if(PACKS.includes(cmd.unit)&&(p.unit==='KG'||p.unit==='UN')&&capacity(p)>0)q=cmd.qty*capacity(p);
 if(q===null){showModal('Confirmar quantidade',`<div class="notice">${esc(p.name)} · ${fmt(cmd.qty)} ${cmd.unit}. Não há conversão cadastrada para ${p.unit}.</div><div class="field" style="margin-top:12px"><label>Quantidade em ${p.unit} (somar ao estoque)</label><input id="voiceQty" type="number" inputmode="decimal" min="0" step="any" value="${cmd.qty}" onfocus="this.select()"></div><button class="primary full" onclick="confirmVoiceQty('${p.id}')">Confirmar</button>`);return}
 let had=state.stock[p.id];state.stock[p.id]=Math.round((num(had)+q)*1000)/1000;persist();render();toast(`✓ ${p.name} · +${fmt(q)} ${p.unit} (total ${fmt(state.stock[p.id])})`,()=>{if(had===undefined)delete state.stock[p.id];else state.stock[p.id]=had;persist();render()})}
function confirmVoiceQty(id){let q=num($('#voiceQty').value);if(!q)return toast('Informe uma quantidade');state.stock[id]=Math.round((num(state.stock[id])+q)*1000)/1000;persist();closeModal();render();toast('Contagem salva')}

// ---------- Leitura de código de barras ----------
async function openScanner(target=''){
 if(!window.isSecureContext){showModal('Permissão de câmera',`<div class="notice">A câmera exige conexão segura. Abra o aplicativo por HTTPS (ou localhost no computador). Enquanto isso, digite o código abaixo ou use a busca.</div><div class="field" style="margin-top:12px"><label>Código da mercadoria</label><input id="scanManual" placeholder="Digite o código"></div><button class="primary full" onclick="acceptScan($('#scanManual').value,'${target}')">Buscar código</button>`);return}
 if(target==='pcode')window.__scanProductId=selected;
 if(!navigator.mediaDevices?.getUserMedia){toast('Câmera indisponível neste navegador.');return}
 showModal('Ler etiqueta / código',`<video id="cam" autoplay playsinline muted></video><div class="notice" style="margin-top:8px">A leitura automática usa o BarcodeDetector do navegador, quando disponível. Se não funcionar, digite o código abaixo.</div><div class="field" style="margin-top:12px"><label>Código da mercadoria</label><input id="scanManual" placeholder="Digite o código"></div><button class="primary full" onclick="acceptScan($('#scanManual').value,'${target}')">Buscar código</button>`);
 try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});let v=$('#cam');if(!v){stopCamera();return}v.srcObject=cameraStream;await v.play();
  if('BarcodeDetector'in window){let detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','code_128']}),token=cameraStream;const tick=async()=>{if(cameraStream!==token)return;try{let found=await detector.detect(v);if(found.length){acceptScan(found[0].rawValue,target);return}}catch(e){}scanLoop=setTimeout(tick,300)};tick()}else toast('Leitura automática indisponível; use o código manual')
 }catch(e){let why=e.name==='NotAllowedError'?'A permissão da câmera foi negada. Libere o acesso à câmera para este site nas configurações do Chrome.':e.name==='NotFoundError'?'Nenhuma câmera foi encontrada.':e.name==='NotReadableError'?'A câmera está em uso por outro aplicativo.':'Não foi possível abrir a câmera.';showModal('Câmera indisponível',`<div class="notice">${why} Você ainda pode buscar o produto pelo nome ou código.</div><button class="primary full" style="margin-top:12px" onclick="closeModal()">Entendi</button>`)}}
function stopCamera(){if(scanLoop)clearTimeout(scanLoop);scanLoop=null;if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}}
function acceptScan(code,target=''){code=String(code||'').trim();if(!code)return toast('Informe um código');stopCamera();let pid=window.__scanProductId;closeModal();
 if(target){openProduct(pid||'',{code});window.__scanProductId=null;return}
 let p=state.products.find(p=>p.code===code||p.barcode===code);
 if(p){if(page==='order'){query=p.name;render();toast('Produto localizado: '+p.name)}else openCount(p.id)}
 else{window.__pendingCode=code;showModal('Código não encontrado',`<div class="notice">O código ${esc(code)} não consta no dicionário.</div><button class="primary full" style="margin-top:12px" onclick="openProduct('',{code:window.__pendingCode})">Cadastrar novo produto</button>`)}}

// ---------- Inicialização imediata (sem tela de carregamento) ----------
function showStartupError(err){let root=document.getElementById('app');if(root&&!root.innerHTML.trim())root.innerHTML='<main style="padding:24px;font:14px system-ui;color:#075e43"><h2>FLV Mobile</h2><p>Erro ao abrir a interface. Reabra o arquivo.</p></main>';console.error('FLV:',err)}
async function boot(){
 try{render()}catch(e){showStartupError(e);return}   // interface aparece na hora; dados chegam em seguida
 let loadErr=null;
 try{await storeOpen();let saved=await dbGet();if(saved&&Array.isArray(saved.products))state=normalizeState(saved);else{try{let ls=JSON.parse(localStorage.getItem(LS_KEY));if(ls&&Array.isArray(ls.products)){state=normalizeState(ls);setTimeout(()=>toast('Dados recuperados do armazenamento alternativo'),400)}}catch(_){}}}
 catch(e){loadErr=e;db=null;try{let ls=JSON.parse(localStorage.getItem(LS_KEY));if(ls&&Array.isArray(ls.products))state=normalizeState(ls)}catch(_){}console.warn('IndexedDB indisponível',e)}
 bootReady=true;document.body.classList.remove('booting');
 try{render()}catch(e){showStartupError(e)}
 if(loadErr)setTimeout(()=>toast('Banco local indisponível: usando armazenamento alternativo. Faça backups.'),500);
 try{navigator.storage?.persist?.()}catch(_){}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){persistNow();return}try{ensureDay();render();if(voiceActive)startVoiceRecognition()}catch(e){console.error(e)}});
window.addEventListener('pagehide',()=>{persistNow()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#portal').innerHTML)closeModal()});
setInterval(()=>{if(bootReady&&state.lastDate!==today()&&!modal){try{render()}catch(e){}}},60000);
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(page==='settings'&&!modal)render()});
window.addEventListener('appinstalled',()=>{installEvt=null;if(page==='settings')render()});
async function installApp(){if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice}catch(_){}installEvt=null;render()}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW',e)));
boot();
</script></body></html>
